name: Tests and evaluation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run credentialed exploratory corpus benchmark (consumes provider quota)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip check
      - run: pytest
      - run: python -m eval.evaluate --validate
      - run: docker build -t evidencegraph-x:ci .
  benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      COLLECTION: evidencegraph_ci
      GRAPH_ENABLED: 'false'
      BASELINE_JSON: ${{ vars.EVAL_BASELINE_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m eval.evaluate --download-corpus
      - run: python -m eval.evaluate --ingest-corpus
      - run: python -m eval.evaluate --allow-unreviewed
      - name: Compare audited measured baseline when supplied
        if: env.BASELINE_JSON != ''
        run: |
          python - <<'PY_GATE'
          import json, os
          from pathlib import Path
          from eval.evaluate import compare_baseline
          baseline = Path('eval/results/baseline.json')
          baseline.write_text(os.environ['BASELINE_JSON'])
          current = json.loads(Path('eval/results/full/summary.json').read_text())
          compare_baseline(current, str(baseline), 0.02)
          PY_GATE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploratory-evaluation
          path: eval/results/
